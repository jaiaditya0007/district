name: District Vimal 70MM Seat Monitor
on:
  schedule:
    # Runs automatically every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
concurrency:
  group: vimal-monitor
  cancel-in-progress: true
# Grants explicit write permissions so Actions can push state updates back to the repo
permissions:
  contents: write
jobs:
  monitor:
    runs-on: ubuntu-latest
    # FIX: script now runs for 5h30m max, giving ~30 min of buffer under this
    # 360-min timeout for checkout, dependency install, and graceful shutdown.
    timeout-minutes: 360
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi beautifulsoup4 requests
      - name: Configure Git for State Auto-Sync
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
      - name: Run District Monitor Loop
        env:
          PYTHONUNBUFFERED: "1"
        run: python -u district.py
